  state:
    release: stable
    api: stable
  date: 2013-08-30
  license:
    identifier: GPL-2.0
    uri: http://www.horde.org/licenses/gpl
  notes: "[mjr] Fix Wbxml output of SEARCH_TOTAL and SEARCH_RANGE values in SEARCH responses (Bug #12624).\n[mjr] Allow reducing the amount of tag content that is logged to the Wbxml log.\n[mjr] Fix broken wbxml in certain cases due to incorrect handling of encoding empty array values (Bug #12595).\n[mjr] Detect IMAP message deletions on non-CONDSTORE servers during PING requests (Request #12597, Thomas Jarosch <thomas.jarosch@intra2net.com>).\n[mjr] Do not initiate a looping SYNC if there were any incoming changes, this prevents an unnecessary backend ping for each collection.\n[mjr] Fix issue that could cause message deletions on the server to not be trasmitted to the client if the message falls outside of the FILTER window and the IMAP server does not support CONDSTORE.\n[mjr] Don't filter out messages flagged as DELETED during initial sync request.\n"
2.6.2:
  api: 2.6.0
  state:
    release: stable
    api: stable
  date: 2013-08-18
  license:
    identifier: GPL-2.0
    uri: http://www.horde.org/licenses/gpl
  notes: "[mjr] Fix issue that could cause corrupt email attachment downloads on certain webservers due to PHP flushing the output buffer (Bug #12486).\n[mjr] Output X-MS-RP header to advertise to clients that a more recent EAS version is supported on the server.\n[mjr] Fix issue that could lead to email being duplicated on client due to incorrect Collection Type being detected for unsolicited SMS data (Bug #12544).\n[mjr] Fix decoding EAS Timezone blobs on Big Endian systems.\n[mjr] Fix race condition where changes may not be sent to the client due to a combination of a long running MOREAVAILABLE sync and server side changes.\n"
2.6.1:
  api: 2.6.0
  state:
    release: stable
    api: stable
  date: 2013-08-08
  license:
    identifier: GPL-2.0
    uri: http://www.horde.org/licenses/gpl
  notes: "[mjr] Do not ask the IMAP server to fetch flags if we don't have an empty imap search result (Bug #12551).\n[mjr] Fix typos that could cause some sync actions to fail (Bug #12548 and #12523, Thomas Jarosch <thomas.jarosch@intra2net.com>).\n[mjr] Ensure proper failure codes are returned when a client addition fails to be added to the backend during a PARTIAL sync.\n"
2.6.0:
  api: 2.6.0
  state:
    release: stable
    api: stable
  date: 2013-08-08
  license:
    identifier: GPL-2.0
    uri: http://www.horde.org/licenses/gpl
  notes: "[mjr] Fix obtaining the timestamp of the last successful sync when backend uses modification sequences (Bug #12529).\n[mjr] Fix broken Email sync due to clients that send unsolicited SMS data (Bug #12544).\n[mjr] Fix returning incorrect syncstamp when adding, editing, or deleting messages and backend uses modification sequences (Bug #12523).\n[mjr] Fix bug that could cause a sync loop if history data is removed or a collection is empty and therefore has no history data (Bug #12531).\n"
2.5.6:
